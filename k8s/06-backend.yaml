apiVersion: v1
kind: Service
metadata:
  name: erp9lli-backend
  namespace: erp9lli
  labels:
    app: erp9lli-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: erp9lli-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp9lli-backend
  namespace: erp9lli
  labels:
    app: erp9lli-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: erp9lli-backend
  template:
    metadata:
      labels:
        app: erp9lli-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/gabbo9lli/erp9lli-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: erp9lli-config
            - secretRef:
                name: erp9lli-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

apiVersion: v1
kind: Service
metadata:
  name: erp9lli-frontend
  namespace: erp9lli
  labels:
    app: erp9lli-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: erp9lli-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp9lli-frontend
  namespace: erp9lli
  labels:
    app: erp9lli-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: erp9lli-frontend
  template:
    metadata:
      labels:
        app: erp9lli-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/gabbo9lli/erp9lli-frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "100m"

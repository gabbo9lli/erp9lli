apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp9lli-ingress
  namespace: erp9lli
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - gestionale.retebio.it
      secretName: erp9lli-tls-cert
  rules:
    - host: gestionale.retebio.it
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: erp9lli-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: erp9lli-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp9lli-frontend
                port:
                  number: 80

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: erp9lli
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: erp9lli
spec:
  headers:
    sslRedirect: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-rate-limit
  namespace: erp9lli
spec:
  rateLimit:
    average: 10
    burst: 15
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: erp9lli-tls-cert
  namespace: erp9lli
spec:
  secretName: erp9lli-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - 18.200.141.146.sslip.io
---
# 1. IngressRoute HTTP (Porta 80): Reindirizzamento permanente HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: erp9lli-ingressroute-web
  namespace: erp9lli
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: erp9lli-frontend
          port: 80
---
# 2. IngressRoute HTTPS (Porta 443): Cifratura TLS, Security Headers e Rate Limiting
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: erp9lli-ingressroute-websecure
  namespace: erp9lli
spec:
  entryPoints:
    - websecure
  routes:
    # 2.1 Endpoint di Autenticazione protetti da Rate Limiter anti brute-force
    - match: PathPrefix(`/api/signin`) || PathPrefix(`/api/login`) || PathPrefix(`/api/signup`) || PathPrefix(`/api/forgot-password`) || PathPrefix(`/api/reset-password`)
      kind: Rule
      priority: 100
      middlewares:
        - name: security-headers
        - name: auth-rate-limit
      services:
        - name: erp9lli-backend
          port: 8000
    # 2.2 API Backend e WebSockets
    - match: PathPrefix(`/api`) || PathPrefix(`/ws`)
      kind: Rule
      priority: 50
      middlewares:
        - name: security-headers
      services:
        - name: erp9lli-backend
          port: 8000
    # 2.3 Dashboard Grafana
    - match: PathPrefix(`/grafana`)
      kind: Rule
      priority: 40
      middlewares:
        - name: security-headers
      services:
        - name: erp9lli-grafana
          port: 3000
    # 2.4 Frontend SPA
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
      services:
        - name: erp9lli-frontend
          port: 80
  tls:
    secretName: erp9lli-tls-cert

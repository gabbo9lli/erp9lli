apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp9lli-ingress
  namespace: erp9lli
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: erp9lli-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: erp9lli-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp9lli-frontend
                port:
                  number: 80
